<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LoraGi Official Logo Mark">
  <defs>
    <!-- Lorapok Labs Bioluminescent Gradients -->
    <linearGradient id="loraEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <linearGradient id="loraViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="laserBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f5a0"/>
      <stop offset="70%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#00d2ff" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bio Glow Filter -->
    <filter id="bloomGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container & Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="506" height="506" rx="110" stroke="url(#loraEmerald)" stroke-width="2.5" stroke-opacity="0.45" fill="none"/>

  <!-- Subtle Filmstrip Coordinate Grid -->
  <g opacity="0.06" stroke="#00d2ff" stroke-width="1">
    <line x1="96" y1="0" x2="96" y2="512"/>
    <line x1="176" y1="0" x2="176" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="336" y1="0" x2="336" y2="512"/>
    <line x1="416" y1="0" x2="416" y2="512"/>
    <line x1="0" y1="96" x2="512" y2="96"/>
    <line x1="0" y1="176" x2="512" y2="176"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="336" x2="512" y2="336"/>
    <line x1="0" y1="416" x2="512" y2="416"/>
  </g>

  <!-- Center Ambient Core Radiance -->
  <circle cx="256" cy="256" r="215" fill="url(#centerGlow)"/>

  <!-- Orbital Filmstrip Sprocket Track Rings -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#loraEmerald)" stroke-width="2" stroke-dasharray="8 12" opacity="0.35"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#loraViolet)" stroke-width="1.5" stroke-dasharray="14 18" opacity="0.3" transform="rotate(45 256 256)"/>

  <!-- Outer Filmstrip Perforations (Cybernetic Sprockets) -->
  <g opacity="0.5" fill="#00d2ff">
    <rect x="75" y="248" width="16" height="16" rx="4" filter="url(#bloomGlow)"/>
    <rect x="421" y="248" width="16" height="16" rx="4" filter="url(#bloomGlow)"/>
    <rect x="248" y="75" width="16" height="16" rx="4" filter="url(#bloomGlow)"/>
    <rect x="248" y="421" width="16" height="16" rx="4" filter="url(#bloomGlow)"/>
    <circle cx="132" cy="132" r="4.5" fill="#00f5a0" filter="url(#bloomGlow)"/>
    <circle cx="380" cy="132" r="4.5" fill="#a855f7" filter="url(#bloomGlow)"/>
    <circle cx="132" cy="380" r="4.5" fill="#00d2ff" filter="url(#bloomGlow)"/>
    <circle cx="380" cy="380" r="4.5" fill="#00f5a0" filter="url(#bloomGlow)"/>
  </g>

  <!-- Central Dynamic "LG" Bio-Slicer Blades Emblem -->
  <g transform="translate(256, 256)" filter="url(#bloomGlow)">
    <!-- Primary Scissor / Precision Slicer Blade Left ('L' Stem & Cutter Arc) -->
    <path d="M -90 -115 C -90 -40 -35 20 0 20 C 35 20 80 -10 110 -65 C 80 -25 35 5 -10 5 C -55 5 -75 -40 -75 -115 Z" fill="url(#loraEmerald)"/>
    
    <!-- Secondary Interlocking Precision Blade Right ('G' Loop & Slicer Guillotine) -->
    <path d="M 90 115 C 90 40 35 -20 0 -20 C -35 -20 -80 10 -110 65 C -80 25 -35 -5 10 -5 C 55 -5 75 40 75 115 Z" fill="url(#loraViolet)"/>

    <!-- Sharp Laser Cutting Axis (45° Slicing Beam) -->
    <line x1="-135" y1="135" x2="135" y2="-135" stroke="url(#laserBlade)" stroke-width="5" stroke-linecap="round" filter="url(#strongGlow)"/>
    <line x1="-135" y1="135" x2="135" y2="-135" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Biological Larva Aperture Core (Focus Ring) -->
    <circle cx="0" cy="0" r="38" fill="#030611" stroke="url(#loraEmerald)" stroke-width="3" filter="url(#bloomGlow)"/>
    <circle cx="0" cy="0" r="28" fill="url(#centerGlow)"/>
    
    <!-- Central Play / Frame-Cut Diamond Jewel -->
    <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#loraEmerald)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#bloomGlow)"/>

    <!-- Micro Precision Cutting Calipers -->
    <line x1="-38" y1="0" x2="-28" y2="0" stroke="#00f5a0" stroke-width="2.5"/>
    <line x1="28" y1="0" x2="38" y2="0" stroke="#00d2ff" stroke-width="2.5"/>
    <line x1="0" y1="-38" x2="0" y2="-28" stroke="#00f5a0" stroke-width="2.5"/>
    <line x1="0" y1="28" x2="0" y2="38" stroke="#a855f7" stroke-width="2.5"/>
  </g>

  <!-- Cybernetic Corner Flares -->
  <circle cx="48" cy="48" r="2" fill="#00f5a0" opacity="0.6"/>
  <circle cx="464" cy="48" r="2" fill="#00d2ff" opacity="0.6"/>
  <circle cx="48" cy="464" r="2" fill="#a855f7" opacity="0.6"/>
  <circle cx="464" cy="464" r="2" fill="#00f5a0" opacity="0.6"/>
</svg>
